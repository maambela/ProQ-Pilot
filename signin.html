<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProQ Pilot | Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">

    <!-- Main Styles -->
    <link rel="stylesheet" href="css/style.css?v=cart-responsive-smart-recs-20260709">
    <link rel="stylesheet" href="css/signin.css?v=proq-portal-live-glow-20260915">
    <script src="js/auth-ui.js?v=admin-role-20260615"></script>
</head>
<body class="signin-page">

    <svg class="signin-glass-filter" aria-hidden="true" width="0" height="0">
        <filter id="glass-distortion" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise"></feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
        </filter>
    </svg>

    <section class="auth-page">
        <div class="auth-card">
            <div class="signin-brand">
                <a href="development.html" class="signin-logo" aria-label="Return to ProQ Pilot welcome page">
                    <img src="Images/Logos/Proq2.png" alt="ProQ Pilot">
                </a>
            </div>

            <div class="signin-content">
                <div class="signin-heading">
                    <span class="signin-kicker">Secure procurement portal</span>
                    <p>Sign in to continue to your ProQ Pilot workspace.</p>
                </div>

                <button class="provider-button" type="button" id="microsoftSignInButton">
                    <span class="provider-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                    <span>Sign in with Microsoft</span>
                    <i class="bx bx-right-arrow-alt" aria-hidden="true"></i>
                </button>

                <div class="signin-divider"><span>or use email</span></div>

                <form class="auth-form" id="loginForm">
                    <label for="email">Email address</label>
                    <input id="email" type="email" name="email" placeholder="you@company.com" autocomplete="email" required>
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <span class="error-text" id="apiError" style="color: #dc2626; display: none; font-size: 0.8rem; margin-top: 5px;"></span>

                    <button class="btn btn-primary" type="submit">
                        Sign in with email <i class="bx bx-right-arrow-alt" aria-hidden="true"></i>
                    </button>
                </form>

                <div class="auth-links">
                    <span>New to ProQ Pilot?</span>
                    <a href="signup.html">Create an account</a>
                </div>

                <div class="signin-trust">
                    <span><i class="bx bx-shield-quarter" aria-hidden="true"></i> Secure login</span>
                    <span><i class="bx bx-check-circle" aria-hidden="true"></i> 24/7 portal access</span>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const apiError = document.getElementById('apiError');
            apiError.style.display = 'none';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            showLoading('Authenticating...');

            try {
                const response = await fetch('/api/v1/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    const user = result.data.user;
                    const isAdmin = String(user.role || '').trim().toLowerCase() === 'admin';
                    showStatus(
                        isAdmin ? 'Admin Access Granted' : 'Access Granted',
                        isAdmin ? 'Opening your admin dashboard...' : 'Welcome to ProQ Pilot!'
                    );
                    
                    // Store token and user data
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(user));

                    // Short delay for the user to see the success message
                    setTimeout(() => {
                        if (isAdmin) {
                            window.location.href = 'admin_dashboard.html';
                            return;
                        }

                        const params = new URLSearchParams(window.location.search);
                        const redirectTo = params.get('redirect') || 'index.html';
                        window.location.href = redirectTo;
                    }, 1500);
                } else {
                    hideOverlay();
                    apiError.textContent = result.message || 'Login failed';
                    apiError.style.display = 'block';
                }
            } catch (err) {
                hideOverlay();
                apiError.textContent = 'An error occurred. Please try again later.';
                apiError.style.display = 'block';
            }
        });

        document.getElementById('microsoftSignInButton').addEventListener('click', () => {
            const apiError = document.getElementById('apiError');
            apiError.textContent = 'Microsoft sign-in is not enabled for this portal yet. Use your email to continue.';
            apiError.style.display = 'block';
            document.getElementById('email').focus();
        });
    </script>
</body>
</html>
