<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProQ Pilot | Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/session.js?v=entra-access-20260917"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=cart-responsive-smart-recs-20260709">
    <link rel="stylesheet" href="css/signin.css?v=proq-portal-live-glow-20260915">
    <script src="js/auth-ui.js?v=entra-access-20260917"></script>
    <style>
        .signin-page .signin-status { margin: 0 0 18px; padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 12px; line-height: 1.6; }
        .signin-page :is(button,a):focus-visible { outline: 3px solid #44ffe0; outline-offset: 4px; }
        .signin-page .provider-button:disabled { opacity: .6; cursor: wait; }
        .signin-page [hidden] { display: none !important; }
    </style>
</head>
<body class="signin-page">
    <svg class="signin-glass-filter" aria-hidden="true" width="0" height="0">
        <filter id="glass-distortion" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise"></feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
        </filter>
    </svg>
    <main class="auth-page">
        <div class="auth-card">
            <div class="signin-brand">
                <a href="welcome.html" class="signin-logo" aria-label="Return to ProQ Pilot welcome page"><img src="Images/Logos/Proq2.png" alt="ProQ Pilot"></a>
            </div>
            <div class="signin-content">
                <div class="signin-heading">
                    <span class="signin-kicker">Secure access</span>
                    <p class="signin-title">Sign in to ProQ Pilot</p>
                </div>
                <div id="signInStatus" class="signin-status" role="status" aria-live="polite" hidden></div>
                <div class="signin-action">
                    <button class="provider-button" type="button" id="microsoftSignInButton">
                        <span class="provider-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                        <span>Sign in with Microsoft</span>
                        <i class="bx bx-right-arrow-alt" aria-hidden="true"></i>
                    </button>
                </div>
                <p class="signin-secured"><i class="bx bx-lock-alt" aria-hidden="true"></i> Secured by Microsoft</p>
                <div class="signin-or"><span>OR</span></div>
                <form class="signin-email-form" id="emailSignInForm" novalidate>
                    <label for="signinEmail">Email</label>
                    <input id="signinEmail" name="email" type="email" autocomplete="email" required>
                    <label for="signinPassword">Password</label>
                    <input id="signinPassword" name="password" type="password" autocomplete="current-password" required>
                    <button class="email-signin-button" type="submit"><i class="bx bx-envelope" aria-hidden="true"></i><span>Sign in with email</span><i class="bx bx-right-arrow-alt" aria-hidden="true"></i></button>
                </form>
                <a class="signin-home" href="welcome.html" aria-label="Return to welcome page"><i class="bx bx-home" aria-hidden="true"></i></a>
                <div class="signin-trust">
                    <span><i class="bx bx-lock-alt" aria-hidden="true"></i> Secure login</span>
                    <span><i class="bx bx-user" aria-hidden="true"></i> Microsoft work accounts</span>
                </div>
            </div>
        </div>
    </main>
    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);
            const messages = {
                pending_approval: 'Your Microsoft account was verified. An administrator needs to approve your access before you can enter. Try signing in again after approval.',
                company_not_approved: 'Your company is not yet approved for ProQ Pilot. Contact the ProQ Pilot team to arrange access.',
                access_disabled: 'Access for your account or company is currently disabled. Contact your ProQ Pilot administrator.',
                cancelled: 'Microsoft sign-in was cancelled. You can try again when you are ready.',
                invalid_request: 'This sign-in request has expired or is invalid. Start a new sign-in below.',
                not_configured: 'Microsoft sign-in is being set up. Please contact the ProQ Pilot team for access.',
                failed: 'We could not complete Microsoft sign-in. Please try again.',
                session_expired: ''
            };
            const error = params.get('error');
            if (error && messages[error]) {
                document.getElementById('signInStatus').textContent = messages[error] || messages.failed;
                document.getElementById('signInStatus').hidden = false;
            }
            let target = '/index.html';
            try {
                const url = new URL(params.get('redirect') || target, window.location.origin + '/');
                if (url.origin === window.location.origin && /^\/[a-z0-9_-]+\.html$/i.test(url.pathname) && !['/signin.html', '/microsoft-auth-complete.html', '/signup.html', '/resetpassword.html'].includes(url.pathname.toLowerCase())) target = url.pathname + url.search;
            } catch (_) { /* Use the safe local default. */ }
            document.getElementById('microsoftSignInButton').addEventListener('click', event => {
                event.currentTarget.disabled = true;
                document.getElementById('signInStatus').textContent = 'Opening Microsoft sign-in…';
                document.getElementById('signInStatus').hidden = false;
                window.location.assign('/api/auth/microsoft/signin?redirect=' + encodeURIComponent(target));
            });
            window.addEventListener('pageshow', () => { document.getElementById('microsoftSignInButton').disabled = false; });

            document.getElementById('emailSignInForm').addEventListener('submit', async event => {
                event.preventDefault();
                const form = event.currentTarget;
                const button = form.querySelector('button');
                const status = document.getElementById('signInStatus');
                button.disabled = true;
                status.textContent = 'Signing in…';
                status.hidden = false;
                try {
                    const response = await fetch('/api/auth/email/login', {
                        method: 'POST', credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                        body: JSON.stringify({ email: form.email.value, password: form.password.value, redirect: target })
                    });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok || result.status !== 'success') throw new Error(result.message || 'Unable to sign in.');
                    const user = await window.ProQSession.refresh();
                    if (!user) throw new Error('Unable to create a secure session.');
                    window.location.replace(result.data.redirect || target);
                } catch (error) {
                    status.textContent = error.message;
                    status.hidden = false;
                    button.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
